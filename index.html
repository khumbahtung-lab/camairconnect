<style>
:root{--green:#009A44;--red:#CE1126;--yellow:#FCD116;--bg1:rgba(0,154,68,0.30);--bg2:rgba(206,17,38,0.28);--bg3:rgba(252,209,22,0.35)}

.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

function updateVendorCounts(){
  const cats=['All','Food/BBQ','Event Planner / Decor','DJs','MCs','Photographers','Fashion / Makeup','Hair styling / Barber','Entertainment','Tax & Accounting','Legal','Shipping to Cameroon','Handyman Services','Real Estate','Insurance','Health & Wellness','Tutoring & Childcare','Driving School'];
  // category dropdown counts - state filtered
  cats.forEach(cat=>{
    const el=document.getElementById('count-'+cat);
    if(!el) return;
    let list = vendors.filter(v=>{
      const canSee=v.approved||isAdmin||(currentUser&&v.owner_id===currentUser.id);
      if(!canSee) return false;
      if(isVendorExpired(v)) return false;
      if(getVendorState(v)!==stateFilter) return false;
      if(cat!=='All' && v.category!==cat) return false;
      return true;
    });
    const count=list.length;
    el.innerText=count>0?count:'';
    el.className=count>0?'text-xs bg-gray-100 px-2 py-0.5 rounded-full':'hidden';
  });
  // state-filtered approved vendors for main tabs
  const vendorsInState = vendors.filter(v=>{
    const canSee=v.approved||isAdmin||(currentUser&&v.owner_id===currentUser.id);
    return canSee && !isVendorExpired(v) && getVendorState(v)===stateFilter;
  });
  const totalVendors = vendorsInState.length;
  const vendorBadge=document.getElementById('vendorCountBadge');
  const tabVendorEl=document.getElementById('tabVendorCount');
  if(vendorBadge){
    if(totalVendors>0){vendorBadge.innerText=totalVendors;vendorBadge.classList.remove('hidden');} else vendorBadge.classList.add('hidden');
  }
  if(tabVendorEl){
    tabVendorEl.innerText=totalVendors>0?\`(\${totalVendors})\`:'';
    tabVendorEl.className=totalVendors>0?'text-xs bg-green-100 px-2 py-0.5 rounded-full ml-1':'text-xs px-1';
  }
  // Events count per state
  const eventsInState = events.filter(ev=>{
    return getEventState(ev)===stateFilter && getDaysPast(ev.date)<=30;
  });
  const totalEvents = eventsInState.length;
  const tabEventEl=document.getElementById('tabEventCount');
  if(tabEventEl){
    tabEventEl.innerText=totalEvents>0?\`(\${totalEvents})\`:'';
    tabEventEl.className=totalEvents>0?'text-xs bg-blue-100 px-2 py-0.5 rounded-full ml-1':'text-xs px-1';
  }
}

async function loadEvents(){
  const {data,error}=await supabaseClient.from('events').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('events').innerHTML=\`<div class="glass-card p-6 text-center">Error \${error.message}</div>\`;return;}
  let raw=data||[];
  const now=new Date(); now.setHours(0,0,0,0);
  const toDelete=[];
  raw.forEach(ev=>{
    if(!ev.date) return;
    const evDate=new Date(ev.date); evDate.setHours(0,0,0,0);
    const diffDays=Math.floor((now-evDate)/(1000*60*60*24));
    if(diffDays>90) toDelete.push(ev);
  });
  if(toDelete.length>0){
    console.log(\`Auto-deleting \${toDelete.length} events older than 90 days\`);
    for(const ev of toDelete){
      supabaseClient.from('events').delete().eq('id',ev.id).then(r=>{ if(r.error) console.log('delete failed', r.error.message); });
    }
    raw=raw.filter(ev=>{
      const evDate=new Date(ev.date); evDate.setHours(0,0,0,0);
      const diff=Math.floor((now-evDate)/(1000*60*60*24));
      return diff<=90;
    });
  }
  events=raw;
  initStateDetection();
  renderAll();
}

function norm(s){return (s||'').toLowerCase().trim().replace(/\\s+/g,' ');}
function findDuplicate(title,city,date,excludeId){
  const nt=norm(title), nc=norm(city);
  if(!nt || !date) return null;
  return events.find(ev=>{
    if(excludeId && ev.id===excludeId) return false;
    const sameDate = ev.date===date;
    const sameTitle = norm(ev.title)===nt || norm(ev.title).includes(nt) || nt.includes(norm(ev.title));
    const sameCity = nc && norm(ev.city)===nc;
    return sameDate && sameTitle && (sameCity || norm(ev.title).length>4);
  });
}
function checkDuplication(){
  const title=document.getElementById('pTitle').value.trim();
  const city=document.getElementById('pCity').value.trim();
  const date=document.getElementById('pDate').value;
  const warn=document.getElementById('duplicateWarn');
  const txt=document.getElementById('duplicateText');
  const dup=findDuplicate(title,city,date,editingId);
  if(dup){txt.innerHTML=\`<b>\${dup.title}</b> already exists on <b>\${dup.date}</b> in \${dup.city} by \${dup.owner_name||'someone'}.\`;warn.classList.remove('hidden');return dup;} else {warn.classList.add('hidden');return null;}
}
function checkDateConflicts(){

  const box=document.getElementById('dateConflictBox');
  const list=document.getElementById('dateConflictList');
  const titleEl=document.getElementById('dateConflictTitle');
  if(!date){box.classList.add('hidden');return [];}
  const sameDay=events.filter(ev=>ev.date===date && ev.id!==editingId);
  if(sameDay.length===0){
    titleEl.innerHTML=\`✅ No events on \${date} - Great date!\`;
    list.innerHTML=\`<p class="text-green-700">You're first! This date is free.</p>\`;
    box.classList.remove('hidden');box.className='mb-3 p-3 rounded-xl bg-green-50 border border-green-200';return [];
  }
  const sameCity=sameDay.filter(ev=>city && norm(ev.city)===norm(city));
  box.className='mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200';
  titleEl.innerHTML=\`📅 \${sameDay.length} event(s) on \${date} \${sameCity.length?\`⚠️ \${sameCity.length} same city\`:''}\`;
  list.innerHTML=sameDay.map(ev=>{const hl=city && norm(ev.city)===norm(city)?'bg-red-50 border-red-200':'bg-white border-gray-100';return \`<div class="flex justify-between items-center p-2 rounded-lg border \${hl}"><div><b>\${ev.title}</b> <span class="text-gray-500">• \${ev.city} • \${ev.attendees?.length||0} I Dey Go</span></div><div class="text-[10px] \${sameCity.includes(ev)?'text-red-600 font-bold':''}">\${sameCity.includes(ev)?'SAME CITY!':''}</div></div>\`}).join('');box.classList.remove('hidden');return sameDay;
}

  const conflicts=events.filter(ev=>ev.date===date && ev.id!==editingId && getEventState(ev)===state);

async function detectAndSetState(){
  const btn=document.querySelector('[onclick="detectAndSetState()"]');
  if(btn) btn.innerText='⌛ Locating...';
  if(!navigator.geolocation){ detectViaIP(); if(btn) btn.innerText='📍 Use My Current Location (Auto-Detect)'; return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const lat=pos.coords.latitude, lng=pos.coords.longitude;
      const res=await fetch(\`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=\${lat}&longitude=\${lng}&localityLanguage=en\`);
      const data=await res.json();
      let stateCode=data.principalSubdivisionCode?.split('-')[1];
      const map={'MASSACHUSETTS':'MA','MARYLAND':'MD','VIRGINIA':'VA','TEXAS':'TX','GEORGIA':'GA','NEW YORK':'NY','MINNESOTA':'MN','CALIFORNIA':'CA','NEW JERSEY':'NJ','OHIO':'OH','WASHINGTON':'WA','FLORIDA':'FL','NORTH CAROLINA':'NC','ILLINOIS':'IL'};
      if(data.principalSubdivision && map[data.principalSubdivision.toUpperCase()]) stateCode=map[data.principalSubdivision.toUpperCase()];
      if(stateCode && US_STATES.find(s=>s.code===stateCode)){
        detectedState=stateCode;
        document.getElementById('detectionText').innerText=\`We detected you're in \${US_STATES.find(s=>s.code===stateCode).name} (\${stateCode})\`;
        document.getElementById('stateDetectionBanner').classList.remove('hidden');
        if(!localStorage.getItem('camair_homeState')){ setState(stateCode, false); }
      } else { openStateSelector(); }
    }catch(e){ detectViaIP(); }
    if(btn) btn.innerText='📍 Use My Current Location (Auto-Detect)';
  }, err=>{ detectViaIP(); if(btn) btn.innerText='📍 Use My Current Location (Auto-Detect)'; });
}
async function detectViaIP(){
  try{
    const res=await fetch('https://ipapi.co/json/');
    const data=await res.json();
    const stateCode=data.region_code;
    if(stateCode && US_STATES.find(s=>s.code===stateCode)){
      detectedState=stateCode;
      if(!localStorage.getItem('camair_homeState')){
        setState(stateCode, false);
        document.getElementById('detectionText').innerText=\`We detected you're in \${US_STATES.find(s=>s.code===stateCode).name} (\${stateCode}) via IP\`;
        document.getElementById('stateDetectionBanner').classList.remove('hidden');
      }
    } else { openStateSelector(); }
  }catch(e){ openStateSelector(); }
}

function getDaysPast(dateStr){
  if(!dateStr) return 0;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=new Date(dateStr); d.setHours(0,0,0,0);
  return Math.floor((now-d)/(1000*60*60*24));
}

    const evState=getEventState(ev);
    if(evState!==stateFilter) return false;
    if(zoneFilter!=='All'&&ev.zone!==zoneFilter) return false;
    if(search&&!(ev.title.toLowerCase().includes(search)||ev.city.toLowerCase().includes(search)||(ev.description||'').toLowerCase().includes(search)||evState.toLowerCase().includes(search))) return false;
    const daysPast=getDaysPast(ev.date);

  });

// === IMAGE COMPRESSION - Auto compress to <500KB ===
async function compressImage(file, maxWidth=1024, maxSizeKB=500){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let width=img.width, height=img.height;
        if(width>maxWidth){
          height=Math.round((height*maxWidth)/width);
          width=maxWidth;
        }
        const canvas=document.createElement('canvas');
        canvas.width=width;
        canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        
        let quality=0.8;
        let dataUrl=canvas.toDataURL('image/jpeg', quality);
        
        // Reduce quality until under maxSizeKB
        let attempts=0;
        while(dataUrl.length/1024 > maxSizeKB*1.37 && quality>0.2 && attempts<6){
          quality-=0.1;
          dataUrl=canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }
        
        // If still too big, reduce dimensions further
        if(dataUrl.length/1024 > maxSizeKB*1.37){
          const smallerCanvas=document.createElement('canvas');
          const smallerWidth=Math.round(width*0.7);
          const smallerHeight=Math.round(height*0.7);
          smallerCanvas.width=smallerWidth;
          smallerCanvas.height=smallerHeight;
          const sctx=smallerCanvas.getContext('2d');
          sctx.drawImage(img,0,0,smallerWidth,smallerHeight);
          dataUrl=smallerCanvas.toDataURL('image/jpeg', 0.6);
        }
        
        const originalKB=Math.round(file.size/1024);
        const compressedKB=Math.round((dataUrl.length*0.75)/1024);
        console.log(\`Compressed \${file.name}: \${originalKB}KB -> \${compressedKB}KB, quality \${quality.toFixed(1)}\`);
        resolve(dataUrl);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function compressImages(files, maxCount=4){
  const limited=Array.from(files).slice(0,maxCount);
  const results=[];
  for(const file of limited){
    try{
      const compressed=await compressImage(file, 1024, 500);
      results.push(compressed);
    }catch(e){
      console.warn('Compression failed for', file.name, e);
      // Fallback to original as base64
      const fallback=await new Promise((res,rej)=>{
        const fr=new FileReader();
        fr.onload=ev=>res(ev.target.result);
        fr.onerror=rej;
        fr.readAsDataURL(file);
      });
      results.push(fallback);
    }
  }
  return results;
}

    const basePayload={business_name:business,city,zone,category,description:desc,dishes:dishesRaw,whatsapp:whatsappRaw,whatsapp_clean:whatsapp,phone,flyer,owner_name:currentProfile?.name||currentUser.email.split('@')[0],owner_email:currentUser.email,owner_id:currentUser.id};

    if(editingVendorId){
      result=await supabaseClient.from('vendors').update(withAll).eq('id',editingVendorId).select();
      if(result.error && isColErr(result.error.message)){
        result=await supabaseClient.from('vendors').update(withLinks).eq('id',editingVendorId).select();
        if(result.error && isColErr(result.error.message)){
          result=await supabaseClient.from('vendors').update(baseWithState).eq('id',editingVendorId).select();
          if(result.error && isColErr(result.error.message)){
            result=await supabaseClient.from('vendors').update(basePayload).eq('id',editingVendorId).select();
          }
        }
      }
    } else {
      result=await supabaseClient.from('vendors').insert(withAll).select();
      if(result.error && isColErr(result.error.message)){
        result=await supabaseClient.from('vendors').insert(withLinks).select();
        if(result.error && isColErr(result.error.message)){
          result=await supabaseClient.from('vendors').insert(baseWithState).select();
          if(result.error && isColErr(result.error.message)){
            result=await supabaseClient.from('vendors').insert(basePayload).select();
          }
        }
      }
    }
    
    if(btn){btn.innerText=originalText;btn.disabled=false;}
    
    if(result.error){

    if(btn){btn.innerText=originalText;btn.disabled=false;}
    showStatus('❌ '+e.message, true);
    alert('Error: '+e.message);
  }
}
function renderVendors(){
  setupZones();
  const search=document.getElementById('search').value.toLowerCase();
  let filtered=vendors.filter(v=>{
    const canSee=v.approved||(currentUser&&(currentUser.id===v.owner_id||currentUser.email===v.owner_email))||isAdmin;
    if(!canSee)return false;
    const vState=getVendorState(v);
    if(vState!==stateFilter) return false;
    if(zoneFilter!=='All'&&v.zone!==zoneFilter) return false;
    if(vendorFilter!=='All'&&v.category!==vendorFilter) return false;
    if(foodieFilter && !vendorMatchesCraving(v, foodieFilter)) return false;
    if(search){
      const searchLower = search.toLowerCase();
      const matchedCategory = getCategoryFromSearchTerm(searchLower);
      const categoryMatch = matchedCategory ? v.category.toLowerCase() === matchedCategory.toLowerCase() : false;
      const aliasMatch = Object.entries(VENDOR_CATEGORY_ALIASES).some(([cat, aliases]) => 
        cat.toLowerCase() === v.category.toLowerCase() && aliases.some(a=> searchLower.includes(a) || a.includes(searchLower))
      );
      if(!((v.business_name||'').toLowerCase().includes(searchLower)||(v.city||'').toLowerCase().includes(searchLower)||(v.category||'').toLowerCase().includes(searchLower)||(v.description||'').toLowerCase().includes(searchLower)||(getVendorDishes(v).join(' ').toLowerCase().includes(searchLower))||(v.owner_email||'').toLowerCase().includes(searchLower)||(v.owner_name||'').toLowerCase().includes(searchLower)||categoryMatch||aliasMatch)) return false;
    }
    return true;
  });
  const zoneProximity = {
    'Northshore':['Northshore','Boston','Central','Southshore','Western'],
    'Boston':['Boston','Northshore','Southshore','Central','Western'],
    'Southshore':['Southshore','Boston','Northshore','Central','Western'],
    'Central':['Central','Boston','Northshore','Southshore','Western'],
    'Western':['Western','Central','Boston','Northshore','Southshore'],
    'All':['Northshore','Boston','Southshore','Central','Western']
  };
  const order = zoneProximity[zoneFilter] || zoneProximity['All'];
  filtered.sort((a,b)=>{
    const aExp=isVendorExpired(a)?1:0;
    const bExp=isVendorExpired(b)?1:0;
    if(aExp!==bExp) return aExp-bExp;
    if(foodieFilter){
      const aDishes=getVendorDishes(a).join(' ').toLowerCase();
      const bDishes=getVendorDishes(b).join(' ').toLowerCase();
      const aHas=aDishes.includes(foodieFilter.toLowerCase())?0:1;
      const bHas=bDishes.includes(foodieFilter.toLowerCase())?0:1;
      if(aHas!==bHas) return aHas-bHas;
    }
    const aZoneIdx=order.indexOf(a.zone);
    const bZoneIdx=order.indexOf(b.zone);
    if(aZoneIdx!==bZoneIdx) return aZoneIdx-bZoneIdx;
    return 0;
